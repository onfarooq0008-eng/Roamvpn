plugins {
    id 'com.android.application'
}

// Release signing: reads from keystore.properties (gitignored, never committed).
// Safe if that file doesn't exist yet -- release builds just won't be signed
// until you create it (see keystore.properties.example + the README for how
// to generate a real keystore). This never affects debug builds either way.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasSigningConfig = keystorePropertiesFile.exists()
if (hasSigningConfig) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Version shown in the app. To ship an update, raise both defaults (Play needs a higher versionCode per upload).
// CI overrides them with -PappVersionCode / -PappVersionName if you set VERSION_CODE_BASE (see .github/workflows/build.yml).
def appVersionCode = (project.findProperty('appVersionCode') ?: '1').toString().toInteger()
def appVersionName = (project.findProperty('appVersionName') ?: '1.0.0').toString()

android {
    namespace 'com.roamvpn'
    compileSdk 36

    defaultConfig {
        applicationId "com.roamvpn"
        minSdk 24
        targetSdk 36
        versionCode appVersionCode
        versionName appVersionName
        vectorDrawables { useSupportLibrary true }

        // Baked into every build -- every user of the published app automatically
        // uses this backend with zero setup on their end. Update this one line
        // whenever you change which server is your "brain".
        buildConfigField "String", "DEFAULT_BACKEND_API_URL", "\"https://api.fastvpnn.pp.ua\""

        // The "Go Premium" crown opens the Premium screen from the design. There is no paid tier or
        // billing in the app yet, so it stays hidden. Flip to true only once Premium really exists
        // (see ui/PremiumActivity.kt for what has to be built first).
        buildConfigField "boolean", "SHOW_PREMIUM", "false"

    }

    signingConfigs {
        if (hasSigningConfig) {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // REAL Yandex ads in the release build you publish. Flip to "true" to ship a release build
            // that still shows only test ads (e.g. for a final QA pass).
            buildConfigField "boolean", "USE_TEST_ADS", "false"
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasSigningConfig) {
                signingConfig signingConfigs.release
            }
            // Fixes the Play Console warning "contains native code, and you've
            // not uploaded debug symbols" -- the WireGuard tunnel library ships
            // native .so files. FULL bundles complete debug symbols into the
            // AAB automatically so Play Console can symbolicate native crashes/ANRs.
            ndk {
                debugSymbolLevel 'FULL'
            }
        }
        debug {
            // Debug builds ALWAYS use Yandex demo ads.
            buildConfigField "boolean", "USE_TEST_ADS", "true"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES']
        }
    }
}


configurations.configureEach {
    // No Jetpack Compose UI in this app; lifecycle-runtime-compose 2.11.0 would demand compileSdk 37 + AGP 9.1.
    exclude group: 'androidx.lifecycle', module: 'lifecycle-runtime-compose'
    exclude group: 'androidx.lifecycle', module: 'lifecycle-runtime-compose-android'
}

dependencies {
    // Removed as unused (no code or layout referenced them): constraintlayout, cardview, coordinatorlayout,
    // lifecycle-livedata-ktx, gson. Material already brings in whatever it needs transitively.
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    // Stable as of 1.1.0 (was pinned to a years-old 1.1.0-alpha06). Note: this
    // release also deprecates EncryptedSharedPreferences/MasterKey in favor of
    // DataStore + Tink -- the deprecated APIs are still fully functional here,
    // but a future migration should account for migrating already-stored keys.
    implementation 'androidx.security:security-crypto:1.1.0'

    // Official WireGuard userspace backend for Android
    implementation 'com.wireguard.android:tunnel:1.0.20260102'

    // Ads: Yandex Mobile Ads SDK 8.6.0 (the only ad network): native + interstitial.
    implementation 'com.yandex.android:mobileads:8.6.0'

    // Networking (backend API + ping)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'

    testImplementation 'junit:junit:4.13.2'
}
